name: Deploy to Hostinger (pizza-maxx.com)
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload changed files over SSH (never deletes anything on the server)
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          TARGET: /home/u225483144/domains/pizza-maxx.com/deploy-test/
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          echo '[191.96.63.142]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHYG5djaT31bujZyYPwfMrjPJ1VWMWHA6K76s/4egyL3' > ~/.ssh/known_hosts
          rsync -rlptvz --checksum \
            --exclude='.git/' --exclude='.github/' --exclude='.gitignore' --exclude='.DS_Store' \
            -e "ssh -p 65002 -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            ./ u225483144@191.96.63.142:"$TARGET"
